[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "gpu-batch-crypto"
version = "0.3.0"
description = "Standalone CUDA batch AES-GCM and P-256 ECDSA technical preview"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = ["cryptography>=46,<51"]

[project.optional-dependencies]
interop = ["PyJWT==2.13.0"]

[tool.setuptools.packages.find]
where = ["python"]
