name: CPU correctness and package checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install '.[interop]'
      - run: python -m unittest discover -s tests -v
      - run: python tools/verify_extraction.py
      - run: python tools/generate_p256_tables.py --check
      - run: python benchmarks/verify_results.py
      - run: python benchmarks/verify_p256_results.py
      - run: python benchmarks/verify_p256_results.py --directory dispatch_results
      - run: python benchmarks/verify_pipeline.py
      - run: python benchmarks/report_pipeline.py --check
      - run: python benchmarks/report_rtx3060.py --check
      - run: python benchmarks/verify_ready_wave.py
      - run: python benchmarks/report_ready_wave.py --check
      - run: python benchmarks/verify_access_book.py
      - run: python benchmarks/report_access_book.py --check
      - run: python benchmarks/report_http_access.py --check
      - run: python benchmarks/report_http_overhead.py --check
      - run: python benchmarks/report_p256.py --check
      - run: python benchmarks/verify_history.py
      - run: python benchmarks/report_batching.py --check
      - run: python examples/content_grant.py
      - run: python examples/cpu_only.py
      - run: python examples/jws_grant.py
      - run: python examples/access_book_demo.py
      - run: python examples/http_access_demo.py
  python-package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install build
      - name: Build source distribution, then wheel from that distribution
        run: python -m build --outdir dist/python
      - run: python tools/check_distributions.py --python-dist dist/python
      - name: Adopt wheel outside the checkout, then add optional token consumer
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/consumer"
          consumer="$RUNNER_TEMP/consumer/bin/python"
          wheels=("$GITHUB_WORKSPACE"/dist/python/*.whl)
          test "${#wheels[@]}" -eq 1
          "$consumer" -m pip install "${wheels[0]}"
          cd "$RUNNER_TEMP"
          "$consumer" -I "$GITHUB_WORKSPACE/tools/check_python_install.py"
          "$consumer" -I "$GITHUB_WORKSPACE/examples/cpu_only.py"
          "$consumer" -m pip install "${wheels[0]}[interop]"
          "$consumer" -I "$GITHUB_WORKSPACE/examples/jws_grant.py" --count 8
          cp -R "$GITHUB_WORKSPACE/examples/access_book" "$RUNNER_TEMP/access_book"
          cp "$GITHUB_WORKSPACE/examples/access_book_demo.py" "$RUNNER_TEMP/access_book_demo.py"
          "$consumer" "$RUNNER_TEMP/access_book_demo.py"
  native-cpu:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Build pinned OpenSSL with platform assembly enabled
        run: |
          curl --fail --location --retry 3 https://github.com/openssl/openssl/releases/download/openssl-3.5.8/openssl-3.5.8.tar.gz -o /tmp/openssl.tar.gz
          echo 'a8f84a39918ec6415ce765d9b429d313ba97b8143169c172e734b9514464f5b2  /tmp/openssl.tar.gz' | sha256sum --check
          tar -xzf /tmp/openssl.tar.gz -C /tmp
          cd /tmp/openssl-3.5.8
          ./Configure --prefix=/tmp/openssl-sdk no-shared no-tests no-apps no-docs
          make -j2
          make install_sw
      - run: cmake -S benchmarks/native -B build-pipeline -DCMAKE_BUILD_TYPE=Release -DOPENSSL_ROOT_DIR=/tmp/openssl-sdk -DOPENSSL_USE_STATIC_LIBS=TRUE
      - run: cmake --build build-pipeline --parallel 2
      - run: ctest --test-dir build-pipeline --output-on-failure
# Hosted CPU CI does not validate CUDA compilation or GPU correctness.
